name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk vidcut.apk

      - uses: actions/upload-artifact@v4
        with:
          name: vidcut-apk
          path: vidcut.apk

      - name: Publish "Latest build" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest vidcut.apk \
            --title "Latest build" \
            --notes "Build ${GITHUB_RUN_NUMBER} from commit ${GITHUB_SHA::7}. Debug build — install by opening vidcut.apk on your phone." \
            --target "$GITHUB_SHA" \
            --latest
